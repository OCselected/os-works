name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      dist-dir: public

    steps:
      - uses: actions/checkout@v4

      # Install Hugo
      - name: Install Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.164.0'

      # Build Hugo site → public/
      - name: Hugo build
        run: |
          mkdir -p public
          hugo --minify -d public
      # Generate TOC from SUMMARY.md (Python 依赖)
      - name: Generate TOC
        run: python3 scripts/gen_toc.py
      # Install WeasyPrint + pandoc + fonts
      #- name: Install build tools
      #  run: |
      #    sudo apt-get update
      #    sudo apt-get install -y pandoc fonts-noto-cjk fonts-noto-core
      #    pip install weasyprint>=60

      # Build PDF + EPUB → public/dist/
      # - name: Build PDF/EPUB
      #  env:
      #    WEASYPRINT: weasyprint
      #  run: |
      #    bash build-dist.sh
      #    mkdir -p public/dist
      #    cp dist/*.pdf dist/*.epub public/dist/
      # Copy CNAME (custom domain) into public/
      - name: Copy CNAME
        run: cp CNAME public/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
