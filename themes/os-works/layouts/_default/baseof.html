<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }}{{ if ne .Type "home" }} · {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600;8..60,700&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
</head>
<body>
<header class="topbar">
  <a class="topbar-brand" href="{{ "/" | relURL }}">「开源之道」· 作品</a>
  <span class="topbar-section">{{ .Section | humanize }}</span>
</header>
{{ block "main" . }}{{ end }}
<footer>
  <div class="footer-inner">
    <span>© {{ now.Format "2006" }} <strong>「开源之道」· 适兕</strong></span>
    <span><a href="https://www.opensourceway.blog/">开源之道博客</a></span>
  </div>
</footer>
</body>
</html>
